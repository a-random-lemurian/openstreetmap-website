services:
  web:
    build:
      context: .
    environment:
      PIDFILE: /tmp/pids/server.pid
    volumes:
      - .:/app
      # Prevent these directories from mounting so they're not shared between host OS and Docker
      - /app/node_modules/
      # Mount a tmp directory that will persist between runs
      - web-tmp:/app/tmp
      # Mount a storage directory that will persist between runs
      - web-storage:/app/storage
    tmpfs:
      /tmp/pids/
      #ports:
      #- "3000:3000"
    stdin_open: true
    tty: true
    command: bundle exec rails s -p 3000 -b '::' #0.0.0.0'
    depends_on:
      apidb:
        condition: service_healthy
    networks:
      osmweb-net:
        ipv6_address: fc00:8940:1c49:1320::80

  # You're going to need to build the dockerfile and clone that repo...
  cgimap:
    image: cgimap:noble
    environment:
      CGIMAP_HOST: db.andirika-osm.lem
      CGIMAP_MAP_AREA: 25
      MAP_NODES: 100000
    networks:
      osmweb-net:
        ipv4_address: 10.40.153.28
        ipv6_address: fc00:8940:1c49:1320::3215
    volumes:
      - /var/run/cgimap:/cgimap

  apidb:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
        #ports:
      #  - "54321:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: openstreetmap
    volumes:
      # Mount the Postgres data directory so it persists between runs
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      osmweb-net:
        ipv6_address: fc00:8940:1c49:1320::5432

volumes:
  web-tmp:
  web-storage:
  db-data:

networks:
  osmweb-net:
    enable_ipv6: true
    enable_ipv4: true
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.153.0/24
        - subnet: fc00:8940:1c49:1320::/64
